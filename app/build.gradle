plugins {
    id 'com.android.application'
}

android {
    namespace 'com.irlab.camera'
    compileSdk 35

    defaultConfig {
        applicationId 'com.irlab.camera'
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    // Fixed debug keystore (well-known password "android") so every CI build has the same signature
    // and Android installs new versions as updates, keeping app data. For personal sideloading only.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so "assembleRelease" produces an installable APK for personal use.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: the app uses only the Android framework (Camera2, OpenGL ES, MediaStore).
