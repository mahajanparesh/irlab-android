plugins {
    id 'com.android.application'
}

android {
    namespace 'com.irlab.camera'
    compileSdk 35

    defaultConfig {
        applicationId 'com.irlab.camera'
        minSdk 30
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so "assembleRelease" produces an installable APK for personal use.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: the app uses only the Android framework (Camera2, OpenGL ES, MediaStore).
