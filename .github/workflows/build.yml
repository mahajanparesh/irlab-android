name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The ubuntu-latest image ships the Android SDK (ANDROID_HOME is preset).
      - name: Build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/IRLab-1.3-build${GITHUB_RUN_NUMBER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/IRLab-1.3-build${GITHUB_RUN_NUMBER}-release.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: IRLab-apk
          path: dist/*.apk
          retention-days: 30

      # Keep the latest APK on a small `builds` branch (one commit, force-pushed) so it can be fetched with plain git.
      - name: Publish APK to builds branch
        run: |
          cp dist/*-release.apk /tmp/IRLab-latest.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds-tmp
          git rm -rf --quiet .
          cp /tmp/IRLab-latest.apk IRLab-latest.apk
          echo "build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA}" > BUILD.txt
          git add IRLab-latest.apk BUILD.txt
          git commit --quiet -m "APK build ${GITHUB_RUN_NUMBER}"
          git push --force --quiet origin HEAD:builds
